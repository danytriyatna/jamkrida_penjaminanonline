<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="description" content="Metronic Vue Demo" />
  <link rel="icon" type="image/svg+xml" href="/media/logos/jamkrida-jabar-official.svg">
  <link rel="shortcut icon" href="/media/logos/jamkrida-jabar-official.svg">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter:300,400,500,600,700">
  <link rel="stylesheet" href="/splash-screen.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Klaim Online</title>
</head>

<body class="page-loading">
    <!--begin::Theme mode setup on page load-->
    <script>
        let themeMode = "system";

        if (localStorage.getItem("kt_theme_mode_value")) {
            themeMode = localStorage.getItem("kt_theme_mode_value");
        }

        if (themeMode === "system") {
            themeMode = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }

        document.documentElement.setAttribute("data-bs-theme", themeMode);
    </script>
    <!--end::Theme mode setup on page load-->

    <div id="app"></div>

    <!--begin::Loading markup-->
    <div id="splash-screen" class="splash-screen">
        <div class="d-flex align-items-center mb-2">
            <img src="/media/logos/jamkrida-jabar-official.svg" style="height: 55px;" class="me-3" alt="Jamkrida Jabar" />
            <div style="display: flex; flex-direction: column; text-align: left; line-height: 1.1;">
                <span style="font-family: 'Inter', sans-serif; font-weight: 700; font-size: 22px; color: #2c3691; letter-spacing: 0.5px;">Klaim Online</span>
                <span style="font-family: 'Inter', sans-serif; font-weight: 600; font-size: 15px; color: #0da24b; margin-top: 2px;">Jamkrida Jabar</span>
            </div>
        </div>
        <div class="loader-wrapper">
        <span class="loader"></span>
        <span class="loading-text" style="color: #2c3691; font-weight: 600;">Memuat Aplikasi...</span>
        </div>
    </div>
    <!--end::Loading markup-->

    <script type="module" src="/src/main.ts"></script>
</body>

</html>
