<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="description" content="Aplikasi Klaim Online" />
  <link rel="icon" type="image/svg+xml" href="/media/logos/jamkrida-jabar-official.svg">
  <link rel="shortcut icon" href="/media/logos/jamkrida-jabar-official.svg">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter:300,400,500,600,700">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Penjaminan Online</title>
</head>

<body>
    <!--begin::Theme mode setup on page load-->
    <script>
        let themeMode = "system";

        if (localStorage.getItem("kt_theme_mode_value")) {
            themeMode = localStorage.getItem("kt_theme_mode_value");
        }

        if (themeMode === "system") {
            themeMode = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }

        document.documentElement.setAttribute("data-bs-theme", themeMode);
    </script>
    <!--end::Theme mode setup on page load-->

    <div id="app"></div>

    <script type="module" src="/src/main.ts"></script>
</body>

</html>
